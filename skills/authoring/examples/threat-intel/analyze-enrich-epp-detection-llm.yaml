    WorkflowSpecificEventQueryInjectionEventsWithPR2Context:
        id: cdf5c3e0d69f156eaaf56c1f5d3f1b66
        default_name: Workflow-specific event query
        inline_configuration:
            input_schema:
                $schema: https://json-schema.org/draft-07/schema
                properties:
                    sensor_id:
                        type: string
                        title: Sensor id
                        default: '*'
                required:
                    - sensor_id
                type: object
                description: Generated request schema
            output_schema:
                $schema: https://json-schema.org/draft-07/schema
                properties:
                    ComputerName:
                        type: string
                        title: ComputerName
                    InjectedDll:
                        type: string
                        title: InjectedDll
                    InjectedThreadFlags:
                        type: string
                        title: InjectedThreadFlags
                    InjecteeImageFileName:
                        type: string
                        title: InjecteeImageFileName
                    InjectorImageFileName:
                        type: string
                        title: InjectorImageFileName
                    OriginatingCommandLine:
                        type: string
                        title: OriginatingCommandLine
                    OriginatingParentBaseFileName:
                        type: string
                        title: OriginatingParentBaseFileName
                    OriginatingProcessName:
                        type: string
                        title: OriginatingProcessName
                    aid:
                        type: string
                        title: Aid
                required:
                    - ComputerName
                    - InjectedDll
                    - InjectedThreadFlags
                    - InjecteeImageFileName
                    - InjectorImageFileName
                    - OriginatingCommandLine
                    - OriginatingParentBaseFileName
                    - OriginatingProcessName
                    - aid
                type: object
                description: Generated response schema
            config:
                description: ""
                end: now
                repo_or_view: search-all
                search_name: injection query
                search_query: "// Build PR2 lookup table with renamed fields looking at all processes in the last day for the specific aid\n  defineTable(\n      query={\n          #event_simpleName=ProcessRollup2 OR #event_simpleName=SyntheticProcessRollup2\n          | aid=?sensor_id\n          | rename(field=ImageFileName, as=OriginatingProcessName)\n          | rename(field=CommandLine, as=OriginatingCommandLine)\n          | rename(field=\"ParentBaseFileName\", as=\"OriginatingParentBaseFileName\")\n      },\n      name=\"pr2_lookup\",\n      include=[TargetProcessId, OriginatingProcessName, OriginatingCommandLine, OriginatingParentBaseFileName],\n      start=6h, end=now\n  )\n\n  // Find all injection related events around the time of detection\n  | aid=?sensor_id\n   | in(field=\"#event_simpleName\", values=[BrowserInjectedThread,ProcessInjection,DllInjection, DocumentProgramInjectedThread, InjectedThreadFromUnsignedModule, JavaInjectedThread])\n  //Find the PR2 event that is responsible for the injection event\n   | match(table=\"pr2_lookup\", field=ContextProcessId, column=TargetProcessId, strict=false)\n  //Refer to events-data-dictionary for InjectedThreadFlag bitmask mapping \n   | bitfield:extractFlagsAsString(field=\"InjectedThreadFlag\", flagNames=[\n      [0, \"PREV_MODE_KERNEL\"],\n      [1, \"START_ADDRESS_IN_NAMED_PE\"],\n      [2, \"START_ADDRESS_IN_SYS_RANGE\"],\n      [3, \"SYSTEM_THREAD\"],\n      [4, \"SOURCE_PROCESS_IS_SYSTEM\"],\n      [5, \"TARGET_ANALYSIS_FAILED\"],\n      [6, \"CONTEXT_ANALYSIS_FAILED\"],\n      [7, \"START_ADDRESS_IN_NTDLL\"],\n      [8, \"START_ADDRESS_IN_WIN_DLL\"],\n      [9, \"START_ADDRESS_PRIVATE_MEM\"]\n  ], as=\"InjectedThreadFlags\", separator=\" | \")\n  // Default empty fields\n  | default(field=InjectedDll, value=\"Not Available\", replaceEmpty=true)\n  | default(field=OriginatingProcessName, value=\"Not Available\", replaceEmpty=true)\n  | default(field=InjectorImageFileName, value=\"Not Available\", replaceEmpty=true)\n  | default(field=InjecteeImageFileName, value=\"Not Available\", replaceEmpty=true)\n  | default(field=OriginatingCommandLine, value=\"Not Available\", replaceEmpty=true)\n  | default(field=InjectedThreadFlags, value=\"Not Available\", replaceEmpty=true)\n  | default(field=OriginatingParentBaseFileName, value=\"Not Available\", replaceEmpty=true)\n    // Strip \\Device\\HarddiskVolumeN\\ prefix from all filename fields\n  | regex(\"\\\\\\\\Device\\\\\\\\HarddiskVolume\\\\d+\\\\\\\\(?<InjectorImageFileName>.+)\", field=InjectorImageFileName, strict=false)\n  | regex(\"\\\\\\\\Device\\\\\\\\HarddiskVolume\\\\d+\\\\\\\\(?<InjecteeImageFileName>.+)\", field=InjecteeImageFileName, strict=false)\n  | regex(\"\\\\\\\\Device\\\\\\\\HarddiskVolume\\\\d+\\\\\\\\(?<OriginatingProcessName>.+)\", field=OriginatingProcessName, strict=false)\n\n\n  | groupBy([@timestamp, aid, ComputerName, #event_simpleName, ComputerName, InjectorImageFileName, InjecteeImageFileName, InjectedDll, InjectedThreadFlags, OriginatingProcessName, OriginatingCommandLine, OriginatingParentBaseFileName], limit=max)\n  | drop([_count])"
                search_query_args:
                    sensor_id: '*'
                start: 10m
                tags: []
        class: Inline.QueryEvent
        continue_on_error: true
        name: Workflow-specific event query - Injection events with PR2 context
        next:
            - injection_query_returned_results_event_count_gt_0
        properties:
            output_files_only: false
            sensor_id: ${data['Trigger.Detection.EPP.Sensor.SensorID']}
            workflow_csv_header_fields:
                - InjectedDll
                - ComputerName
            workflow_export_event_query_results_to_csv: false
        version_constraint: ~1
    WriteToLogRepoLLMOutput:
        id: 04c59ceb6dff9e6cd89e5f5cf13121ab
        default_name: Write to log repo
        name: Write to log repo - Complete LLM response with metadata
        properties:
            _fields:
                - ${Workflow.Definition.Name}
            custom_json:
                confidence: ${data['WorkflowCustomVariable.confidence']}
                detection_id: ${Trigger.Detection.DetectionID}
                event_type: llm_injection_analysis
                llm_output: ${data['CharlotteAILLMCompletion.FaaS.nlpassistantapi.llminvocator_handler.completion']}
                risk_level: ${data['WorkflowCustomVariable.risk_level']}
                sensor_id: ${data['Trigger.Detection.EPP.Sensor.SensorID']}
                verdict: ${data['WorkflowCustomVariable.verdict']}
                workflow_execution_id: ${Workflow.Execution.ID}
                workflow_name: ${Workflow.Definition.Name}
        version_constraint: ~1
    WriteToLogRepoNoLLMInjectionResults:
        id: 04c59ceb6dff9e6cd89e5f5cf13121ab
        default_name: Write to log repo
        name: Write to log repo - Raw injection results (no AI Agent)
        next:
            - AddCommentToDetectionInjectionSummarynoLLM
        properties:
            _fields:
                - ${Workflow.Definition.Name}
            custom_json:
                detection_id: ${Trigger.Detection.DetectionID}
                event_type: no_llm_injection_results
                injection_event_count: ${data['WorkflowSpecificEventQueryInjectionEventsWithPR2Context.event_count']}
                raw_results: ${WorkflowSpecificEventQueryInjectionEventsWithPR2Context.raw_results}
                sensor_id: ${data['Trigger.Detection.EPP.Sensor.SensorID']}
                workflow_execution_id: ${Workflow.Execution.ID}
                workflow_name: ${Workflow.Definition.Name}
        version_constraint: ~1
conditions:
    data39workflowcustomvariable_risk_level39__39unknown39_ampamp_data39workflowcustomvariable_verdict39:
        next:
            - UpdateVariableBuildExecutiveSummaryComment
        cel_expression: "data['WorkflowCustomVariable.risk_level'] != 'UNKNOWN' \n  && data['WorkflowCustomVariable.verdict'] != 'UNKNOWN' \n  && data['WorkflowCustomVariable.confidence'] != 'UNKNOWN'\n"
        display:
            - data[&#39;WorkflowCustomVariable.risk_level&#39;] != &#39;UNKNOWN&#39; &amp;&amp; data[&#39;WorkflowCustomVariable.verdict&#39;] != &#39;UNKNOWN&#39; &amp;&amp; data[&#39;WorkflowCustomVariable.confidence&#39;] != &#39;UNKNOWN&#39;
        else:
            - PrintData3
    detection_severity_meets_or_exceeds_configured_threshold:
        next:
            - WorkflowSpecificEventQueryInjectionEventsWithPR2Context
        cel_expression: (data['WorkflowCustomVariable.severity_level'] == 'Low' && data['Trigger.Detection.SeverityDisplayName'] in ['Low','Medium','High','Critical']) || (data['WorkflowCustomVariable.severity_level'] == 'Medium' && data['Trigger.Detection.SeverityDisplayName'] in ['Medium','High','Critical']) || (data['WorkflowCustomVariable.severity_level'] == 'High' && data['Trigger.Detection.SeverityDisplayName'] in ['High','Critical']) || (data['WorkflowCustomVariable.severity_level'] == 'Critical' && data['Trigger.Detection.SeverityDisplayName'] in ['Critical'])
        display:
            - Detection severity meets or exceeds configured threshold
        else:
            - PrintDataSeverityBelowThreshold
    injection_query_returned_results_event_count_gt_0:
        next:
            - use_llm_is_true
        cel_expression: data['WorkflowSpecificEventQueryInjectionEventsWithPR2Context.event_count'] > 0
        display:
            - Injection query returned results (event_count &gt; 0)
        else:
            - PrintDataNoInjectionEvents
    tactic_is_equal_to_defense_evasion:
        next:
            - CreateVariable
        expression: Trigger.Detection.EPP.Behavior.TacticName:'Defense Evasion'
        display:
            - Tactic is equal to Defense Evasion
    use_llm_is_false:
        next:
            - UpdateVariableBuildNoLLMComment
        cel_expression: data['WorkflowCustomVariable.use_llm'] == false
        display:
            - use_llm is false
    use_llm_is_true:
        next:
            - CharlotteAILLMCompletion
        cel_expression: data['WorkflowCustomVariable.use_llm'] == true
        display:
            - use_llm is true
        else_if: use_llm_is_false
loops:
    Loop:
        display: For each tags; Sequentially
        name: For each tags; Sequentially
        next:
            - AddCommentToDetectionRecommendations
        for:
            input: WorkflowCustomVariable.tags
            continue_on_partial_execution: false
            sequential: true
        trigger:
            next:
                - AddTagToAlertLLMEnrichmentTags
        actions:
            AddTagToAlertLLMEnrichmentTags:
                id: 6de8a462880ad419680ed5c291b9413f
                default_name: Add tag to alert
                name: Add tag to alert - LLM enrichment tags
                properties:
                    investigatable_id: ${Trigger.Detection.DetectionID}
                    tag: ${data['WorkflowCustomVariable.tags.#']}

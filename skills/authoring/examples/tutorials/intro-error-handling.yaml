        description: Generated response schema
  PrintIfActionSuccessfullyReturnsData:
    id: aadbf530e35fc452a032f5f8acaaac2a
    name: Print if action successfully returns data
    version_constraint: ~1
    properties:
      text_data: ${data['ExampleForErrorHandling.results'][0]}
conditions:
  data_workflow_execution_errors_size_0:
    next:
      - PrintIfActionSuccessfullyReturnsData
    cel_expression: data['Workflow.Execution.Errors'].size() == 0
    display:
      - data[&#39;Workflow.Execution.Errors&#39;].size() == 0
  data_workflow_execution_errors_size_0_2:
    next:
      - ActionFailed
    cel_expression: data['Workflow.Execution.Errors'].size() > 0
    display:
      - data[&#39;Workflow.Execution.Errors&#39;].size() &gt; 0

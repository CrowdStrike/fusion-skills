                    title: Action Input Group
                  last_seen:
                    type: string
                    title: Action Input Last seen
                type: object
              name:
                type: string
                title: Action Name
              node_id:
                type: string
                title: Action Node id
              output:
                properties:
                  devices:
                    items: {}
                    type: array
                    title: Action Output Devices
                type: object
              use_cases:
                items:
                  type: string
                type: array
                title: Action Use cases
              vendor:
                type: string
                title: Action Vendor
              version:
                type: integer
                title: Action Version
            type: object
          cid:
            type: string
            title: Cid
          customer_visible:
            type: boolean
            title: Customer visible
          definition_id:
            type: string
            title: Definition id
          definition_name:
            type: string
            title: Definition name
          definition_version:

# Example: Introduction to Error Handling
# Category: tutorials
# Source: CrowdStrike Content Library

name: Introduction to error handling
description: This playbook demonstrates how users can enable 'continue on failure' from the action execution settings in Fusion, allowing workflows to maintain continuity when an action fails. Instead of the entire workflow failing, the workflow continues to the next node based on your defined error handling configuration, enabling you to add conditional branches to handle errors and implement resilient workflows that gracefully adapt to failures rather than stopping completely.
trigger:
  next:
    - ExampleForErrorHandling
  name: On demand
  type: On demand
actions:
  ActionFailed:
    id: aadbf530e35fc452a032f5f8acaaac2a
    name: Action failed
    version_constraint: ~1
    properties:
      text_data: ${data['Workflow.Execution.Errors']}
  ExampleForErrorHandling:
    id: cdf5c3e0d69f156eaaf56c1f5d3f1b66
    class: Inline.QueryEvent
    name: example for error handling
    version_constraint: ~1
    next:
      - data_workflow_execution_errors_size_0
      - data_workflow_execution_errors_size_0_2
    properties:
      output_files_only: false
      workflow_csv_header_fields: []
      workflow_export_event_query_results_to_csv: false
    inline_configuration:
      config:
        description: ''
        end: now
        repo_or_view: search-all
        search_name: example for error handling
        search_query: '#repo = "fusion"'
        search_query_args: {}
        start: 5m
        tags: []
      output_schema:
        $schema: https://json-schema.org/draft-07/schema
        properties:
          action:
            properties:
              id:
                type: string
                title: Action Id
              input:
